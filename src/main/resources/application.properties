spring.datasource.url=jdbc:postgresql://10.134.178.158:5432/magiwaste_testing
spring.datasource.username=postgres
spring.datasource.password=IP3dbPass
spring.sql.init.continue-on-error=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# enable sql logging
spring.jpa.show-sql=true
#format sql
spring.jpa.properties.hibernate.format_sql=true
# log schema geenration operations
spring.jpa.properties.hibernate.hbm2ddl.auto=update



logging.level.be.kdg.magiwastebackend.testing=DEBUG
server.address=0.0.0.0

#mqtt
logging.level.org.eclipse.paho.client.mqttv3=DEBUG
logging.level.org.springframework.integration.mqtt=DEBUG
management.health.rabbit.enabled=false



