<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notification Testing</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css} ">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>

  </script>
</head>
<body>


<div class="container mt-5">
    <h1>Notifications</h1>
    <div class="dropdown">
        <button class="dropbtn">Notifications <span class="notificationCount">0</span></button>
        <div class="dropdown-content notifications">
            <p>No new notifications</p>
        </div>
    </div>
</div>

<script th:inline="javascript">


    document.addEventListener("DOMContentLoaded", () => {
        console.log("Initializing EventSource...");

        const eventSource = new EventSource("/notifications-stream");

        const notificationsContainer = document.querySelector(".notifications");
        const notificationCountElement = document.querySelector(".notificationCount");

        eventSource.addEventListener("notification", (event) => {
            console.log("New Notification Received:", event.data);
            const message = event.data;

            const notificationItem = document.createElement("div");
            notificationItem.className = "notification-item";
            notificationItem.textContent = message;

            const noNotificationsMessage = notificationsContainer.querySelector("p");
            if (noNotificationsMessage) {
                noNotificationsMessage.remove();
            }
            notificationsContainer.appendChild(notificationItem);

            const currentCount = parseInt(notificationCountElement.textContent || "0");
            notificationCountElement.textContent = currentCount + 1;
            notificationCountElement.style.display = "inline-block";
        });

        console.log("EventSource ready to receive events.");
    });
</script>



</body>
</html>
