<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Waste Bin Fill Level</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
<h1>Waste Bin Fill Level</h1>

<!-- Bar Chart -->
<div id="Barchart"></div>

<script th:inline="javascript">
    var eventsByBin = /*[[${eventsByBin}]]*/ '[[${eventsByBin}]]';
    eventsByBin = JSON.parse(JSON.stringify(eventsByBin));

    var labels = [];
    var data = [];
    for (var binId in eventsByBin) {
        if (eventsByBin.hasOwnProperty(binId)) {
            var events = eventsByBin[binId];
            var totalVolume = 0;
            events.forEach(function (event) {
                totalVolume += event.percentOfVolume;
            });
            var averageVolume = totalVolume / events.length;
            labels.push("Bin ID: " + binId);
            data.push(averageVolume);
        }
    }
    ;

    // Bar Chart Options
    var barChartOptions = {
        series: [{
            name: 'Fill Level (%)',
            data: data
        }],
        chart: {
            type: 'bar',
            height: 250
        },
        plotOptions: {
            bar: {
                horizontal: false,
            }
        },
        xaxis: {
            categories: labels,
        }
    };

    // Render Bar Chart
    var barChart = new ApexCharts(document.querySelector("#Barchart"), barChartOptions);
    barChart.render();
</script>


<div id="HeatmapChart"></div>

<script th:inline="javascript">

    var eventsByBin = /*[[${eventsByBin}]]*/ '[[${eventsByBin}]]';
    eventsByBin = JSON.parse(JSON.stringify(eventsByBin));
    var heatmapData = [];
    for (var binId in eventsByBin) {
        if (eventsByBin.hasOwnProperty(binId)) {
            var events = eventsByBin[binId];
            events.forEach(function (event) {
                heatmapData.push({
                    x: "Bin ID: " + binId,
                    y: event.percentOfVolume
                });
            });
        }
    }

    var heatmapOptions = {
        series: [{
            name: 'Fill Level',
            data: heatmapData
        }],
        chart: {
            height: 300,
            type: 'heatmap',
        },
        plotOptions: {
            heatmap: {
                shadeIntensity: 0.5,
                radius: 0,
                useFillColorAsStroke: true,
                colorScale: {
                    ranges: [
                        {from: 0, to: 34, name: 'low usage', color: '#1b8a5a'},
                        {from: 34, to: 67, name: 'medium usage', color: '#fbb021'},
                        {from: 68, to: 100, name: 'high usage', color: '#ee3e32'},
                    ]
                }
            }
        },
        dataLabels: {
            enabled: false
        },
        stroke: {
            width: 1
        },
        title: {
            text: 'Bin Usage Over Time'
        },
    };
    var heatmapChart = new ApexCharts(document.querySelector("#HeatmapChart"), heatmapOptions);
    heatmapChart.render();
</script>

<h1>Waste Bin Depth, Tilt, and Smoke Events Over Time</h1>
<div id="comboChart"></div>

<script th:inline="javascript">
    var oneBinEvent = /*[[${oneBinEvent}]]*/ '[[${oneBinEvent}]]';
    oneBinEvent = JSON.parse(JSON.stringify(oneBinEvent));

    var labels = [];
    var depthData = [];
    var tiltData = [];
    var smokeData = [];

    var startDate = new Date(oneBinEvent[0].eventDate);
    startDate.setDate(startDate.getDate() - 5);
    var endDate = new Date(oneBinEvent[oneBinEvent.length - 1].eventDate);
    endDate.setDate(endDate.getDate() + 5);

    for (var d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
        labels.push(d.toISOString().split('T')[0]);
    }

    labels.forEach(function (date) {
        var event = oneBinEvent.find(e => e.eventDate.startsWith(date));

        depthData.push(event ? event.percentOfVolume : 0);
        tiltData.push(event && event.tiltState ? 1 : 0);
        smokeData.push(event && event.comfort === 'smoke' ? 1 : 0);
    });

    var options = {
        series: [{
            name: 'Average Depth (%)',
            type: 'line',
            data: depthData
        }, {
            name: 'Tilt Events',
            type: 'column',
            data: tiltData
        }, {
            name: 'Smoke Events',
            type: 'column',
            data: smokeData
        }],
        chart: {
            height: 400,
            type: 'line',
            stacked: false
        },
        stroke: {
            width: [4, 0, 0]
        },
        plotOptions: {
            bar: {
                columnWidth: '50%'
            }
        },
        xaxis: {
            categories: labels,
            title: {
                text: 'Date'
            }
        },
        yaxis: [{
            title: {
                text: 'Average Depth (%)'
            }
        }, {
            opposite: true,
            title: {
                text: 'Tilt & Smoke Events'
            }
        }],
        tooltip: {
            shared: true,
            intersect: false
        },
        legend: {
            position: 'top',
            horizontalAlign: 'center'
        }
    };
    var chart = new ApexCharts(document.querySelector("#comboChart"), options);
    chart.render();
</script>


<h3>Debugging outputs:</h3>
<ul>
    <li th:each="event : ${events}">
        Bin ID: <span th:text="${event.bin.id}"></span>,
        Percent of Volume: <span th:text="${event.percentOfVolume}"></span>,
        Event Date: <span th:text="${event.eventDate}"></span>
    </li>
</ul>

</body>
</html>
