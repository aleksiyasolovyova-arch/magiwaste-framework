<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" th:href="@{css/dashboard.css}">
</head>
<body>
<div id="wrapper" class="d-flex flex-column overflow-hidden min-vh-100 vh-100">
    <!--Navbar-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #367c3b">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Magiwaste</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Dashboard</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                           aria-expanded="false">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/chart">Charts</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn border border-white text-white" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!--    Map-->
    <div id="content" class="d-flex flex-column flex-wrap flex-grow-1 h-100">
        <div id="map" class="vh-100 vw-100"></div>
    </div>

    <!--    Button for expanding dashboard tiles-->
    <p id="dashboard-button-container">
        <a class="btn btn-primary" id="dashboard-button" data-bs-toggle="collapse" href="#collapseExample" role="button"
           aria-expanded="false" aria-controls="collapseExample">
            Expand Dashboard
        </a>
    </p>

    <!--UI-->
    <div class="container p-3" id="dashboard-ui-container">
        <!--        collapsed div-->
        <div class="collapse" id="collapseExample">
            <div class="card card-body "
                 style="height: 80vh;background-color: white;">
                <!--Search bar/filter-->
                <div class="w-100 mb-2">
                    <p>Search Bin by Address</p>
                    <input class="form-control" id="searchInput" type="text" placeholder="Search..">
                </div>
                <script>
                    $(document).ready(function () {
                        $("#searchInput").on("keyup", function () {
                            let value = $(this).val().toLowerCase();
                            console.log("Search value: " + value);
                            $("#dashboard-bins-cards .bin-card").filter(function () {
                                var dataAddress = $(this).attr("data-address") || "";
                                var textContent = $(this).text().toLowerCase();
                                var isMatch = dataAddress.toLowerCase().indexOf(value) > -1 || textContent.indexOf(value) > -1;

                                console.log("Card address:", dataAddress);
                                console.log("Card content:", textContent);
                                console.log("Is match:", isMatch);

                                // Toggle the Bootstrap 'd-none' class to hide/show the element
                                if (isMatch) {
                                    $(this).removeClass("d-none"); // Show the card
                                } else {
                                    $(this).addClass("d-none"); // Hide the card
                                }
                            });
                        });
                    });
                </script>


                <div id="dashboard-bins-cards"
                     class="overflow-auto d-flex flex-wrap flex-row justify-content-between gap-2">
                    <!--Cards-->
                    <div class="bin-card tile rounded border border-opacity-25 border-dark col-lg-2 col-md-4 col-sm-6 d-flex flex-column align-items-center mb-2 overflow-hidden"
                         th:each="point: ${points}"
                         th:attr="data-address=${point.address}">
                        <div class="card-image-container">
                            <img th:src="@{images/bin.png}" class="col-12">
                        </div>
                        <div class="card-content-container">
                            <div class="card-top-content-row d-flex flex-row mt-2">
                                <p th:text="${point.address}" class="col-8 text-start">address</p> <!-- align left-->
                                <h5 th:text="${point.percentOfVolume} + '%'" class="col-4 text-end"
                                    th:style="'color:' + ${point.color}">%</h5> <!-- align right-->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAvsioZ4aiVs6PxJ8VodFIOh2e2nTWXcDo&loading=async&libraries=maps&v=beta"
        defer>
</script>

<script th:inline="javascript">
    //this script needs to be in the main html due to thymeleaf array parsing :(
    function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
            //51.2199° N, 4.4150° E - ANTWERP
            center: {lat: 51.2199, lng: 4.4150},
            zoom: 15,
            disableDefaultUI: true,
            styles: [
                {
                    featureType: "poi", // Points of interest
                    stylers: [{visibility: "off"}], // Hide POIs (businesses, locations, and all that)
                },
                {
                    featureType: "transit", // Transit stations
                    stylers: [{visibility: "off"}], // Hide transit
                },
                {
                    featureType: "administrative.land_parcel", // Land parcels
                    stylers: [{visibility: "off"}], // Hide land parcels
                },
                {
                    featureType: "road", // Roads
                    elementType: "labels.icon", // Icons (e.g., highway icons)
                    stylers: [{visibility: "off"}], // Hide road icons
                },
            ],
        });

        // Points data passed from Thymeleaf
        const points = /*[[${points}]]*/ [];

        console.log(points)
        // Add markers
        points.forEach(point => {
            let marker = new google.maps.Marker({
                position: {lat: point.latitude, lng: point.longitude},
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE, // Circle icon
                    scale: 8,                            // Circle size
                    fillColor: point.color,              // Dynamic color
                    fillOpacity: 1,
                    strokeWeight: 1,                      // No border
                    strokeColor: "black"
                }
            });

            // Create an InfoWindow for the marker
            const infoWindow = new google.maps.InfoWindow({
                content: `<div style="font-size: 14px; max-width: 200px;">
                            <h4>Bin Info</h4>
                            <p><strong>Address:</strong> ${point.address}</p>
                            <p><strong>Volume:</strong> ${point.percentOfVolume}%</p>
                          </div>`
            });

            // Add mouse listener to open the InfoWindow
            marker.addListener("mouseover", () => {
                infoWindow.open({anchor: marker, map, shouldFocus: false});
            });
            marker.addListener("mouseout", () => {
                infoWindow.close({anchor: marker, map, shouldFocus: false});
            });
        });
    }

    // Initialize the map
    window.onload = initMap;
</script>


</body>
</html>
