<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
<div id="wrapper" class="d-flex flex-column overflow-hidden min-vh-100 vh-100">
    <!--Navbar-->
    <nav class="navbar navbar-expand-lg border-bottom" style="background-color: white">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div id="content" class="d-flex flex-column flex-wrap flex-grow-1 h-100">
        <gmp-map center="51.225975036621094,4.436551094055176" zoom="15" map-id="DEMO_MAP_ID">
            <gmp-advanced-marker position="51.225975036621094,4.436551094055176" title="Pothoek"></gmp-advanced-marker>
        </gmp-map>
    </div>
</div>


<script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAvsioZ4aiVs6PxJ8VodFIOh2e2nTWXcDo&loading=async&libraries=maps&v=beta" defer>
</script>
</body>
</html>
