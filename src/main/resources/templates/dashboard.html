<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</head>
<body>
<div id="wrapper" class="d-flex flex-column overflow-hidden min-vh-100 vh-100">
    <!--Navbar-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #367c3b">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Magiwaste</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Dashboard</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                           aria-expanded="false">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn border border-white text-white" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <div id="content" class="d-flex flex-column flex-wrap flex-grow-1 h-100">
        <div id="map" class="vh-100 vw-100"></div>
    </div>
</div>


<script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAvsioZ4aiVs6PxJ8VodFIOh2e2nTWXcDo&loading=async&libraries=maps&v=beta"
        defer>
</script>

<script th:inline="javascript">
    function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
            //51.2199° N, 4.4150° E - ANTWERP
            center: { lat: 51.2199, lng: 4.4150 },
            zoom: 15,
            disableDefaultUI: true,
            styles: [
                {
                    featureType: "poi", // Points of interest
                    stylers: [{ visibility: "off" }], // Hide POIs (businesses, locations, and all that)
                },
                {
                    featureType: "transit", // Transit stations
                    stylers: [{ visibility: "off" }], // Hide transit
                },
                {
                    featureType: "administrative.land_parcel", // Land parcels
                    stylers: [{ visibility: "off" }], // Hide land parcels
                },
                {
                    featureType: "road", // Roads
                    elementType: "labels.icon", // Icons (e.g., highway icons)
                    stylers: [{ visibility: "off" }], // Hide road icons
                },
            ],
        });

        // Points data passed from Thymeleaf
        const points = /*[[${points}]]*/ [];
        console.log(points)
        // Add markers
        points.forEach(point => {
            new google.maps.Marker({
                position: { lat: point.latitude, lng: point.longitude },
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE, // Circle icon
                    scale: 8,                            // Circle size
                    fillColor: point.color,              // Dynamic color
                    fillOpacity: 1,
                    strokeWeight: 1,                      // No border
                    strokeColor: "black"
                }
            });
        });
    }

    // Initialize the map
    window.onload = initMap;
</script>

</body>
</html>
