<div align="center" style="width: 100%;">
    <h2>Types of Bin Charts</h2>
    <div id="chart_div" style="width: 100%; height: 700px;"></div>
    <div id="combo_chart_div" style="width: 100%; height: 700px;"></div>
</div>

<script th:inline="javascript">
    var real_data = /*[[${binData}]]*/ {};
    var combined_data = /*[[${combinedData}]]*/ [];

    $(document).ready(function () {
        google.charts.load('current', {
            packages: ['corechart', 'bar']
        });
        google.charts.setOnLoadCallback(drawColumnChart);
        google.charts.setOnLoadCallback(drawComboChart);
    });

    function drawColumnChart() {
        let data = new google.visualization.DataTable();
        data.addColumn('string', 'Bin');
        data.addColumn('number', 'Fill Percentage');

        Object.keys(real_data).forEach(function (key) {
            data.addRow([key, real_data[key]]);
        });

        let options = {
            title: 'Fill Percentages of Bins',
            hAxis: {
                title: 'Bins'
            },
            vAxis: {
                title: 'Fill Percentage'
            }
        };

        let chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
        chart.draw(data, options);
    }

    function drawComboChart() {
        let data = new google.visualization.DataTable();
        data.addColumn('string', 'Bin');
        data.addColumn('number', 'Usage');
        data.addColumn('number', 'Temperature');

        combined_data.forEach(function (item) {
            data.addRow([item.bin, item.usage, item.temperature]);
        });

        let options = {
            title: 'Weather Impact on Trash Bin Usage',
            vAxes: {
                0: {title: 'Usage (In %)'},
                1: {title: 'Temperature (in C)'}
            },
            seriesType: 'bars',
            series: {1: {type: 'line', targetAxisIndex: 1}},
            hAxis: {
                title: 'Bins'
            }
        };

        let chart = new google.visualization.ComboChart(document.getElementById('combo_chart_div'));
        chart.draw(data, options);
    }
</script>

</body>
</html>
