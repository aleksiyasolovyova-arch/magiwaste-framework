<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css} ">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
</head>
<body>

<table class="table table-striped table-dark">
    <thead>
    <tr>
        <th scope="col">#</th>
        <th scope="col">First Distance</th>
        <th scope="col">Second Distance</th>
        <th scope="col">Titled?</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="list : ${datalists}">
        <th scope="row">Sensor</th>
        <td th:text="${list.getSensorDistance1()}">0</td>
        <td th:text="${list.getSensorDistance2()}">0</td>
        <td th:text="${list.isTiltState()}">false</td>
    </tr>
    </tbody>
</table>

<div class="container d-flex flex-row gap-5 justify-content-center border m-5 py-5 flex-wrap">

    <div th:each="list : ${datalists}">
        <div class="card" style="width: 18rem;">
            <img class="card-img-top" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22286%22%20height%3D%22180%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20286%20180%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cstyle%20type%3D%22text%2Fcss%22%3E%23holder_1933ea39cd3%20text%20%7B%20fill%3Argba(255%2C255%2C255%2C.75)%3Bfont-weight%3Anormal%3Bfont-family%3AHelvetica%2C%20monospace%3Bfont-size%3A14pt%20%7D%20%3C%2Fstyle%3E%3C%2Fdefs%3E%3Cg%20id%3D%22holder_1933ea39cd3%22%3E%3Crect%20width%3D%22286%22%20height%3D%22180%22%20fill%3D%22%23777%22%3E%3C%2Frect%3E%3Cg%3E%3Ctext%20x%3D%22107.1953125%22%20y%3D%2296.3%22%3E286x180%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E" alt="Card image cap">
            <div class="card-body">
                <h5 class="card-title">Sensor</h5>
                <p class="card-text">Data from sensor request</p>
                <p th:text="'Sensor1: ' +${list.getSensorDistance1()}" class="lh-sm"></p>
                <p th:text = "'Sensor1: ' +${list.getSensorDistance2()}" class="lh-sm"></p>
                <p th:text = "'Tilt: ' +${list.getTilted()}" class="lh-sm"></p>
<!--                <a href="#" class="btn btn-primary"></a>-->
            </div>
        </div>
    </div>

</div>

</body>
</html>
